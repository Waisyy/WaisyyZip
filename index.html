<!DOCTYPE html>
<html lang="ru"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeBox — твой кинотеатр</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
    <div class="login-box animate-fade-in">
        <div class="login-logo">🎬</div>
        <h1>AnimeBox</h1>
        <p>Введите пароль для доступа к коллекции</p>
        <input type="password" id="passwordInput" placeholder="Пароль" autofocus>
        <button id="loginBtn">
            <span>Войти</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </button>
        <div id="errorMsg" class="error-msg">❌ Неверный пароль</div>
    </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div id="mainContent">

    <!-- ШАПКА -->
    <header class="header animate-slide-down">
        <div class="logo">🎬 AnimeBox</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Поиск фильмов, сериалов..." autocomplete="off">
            <button id="searchBtn">🔍</button>
        </div>
        <div class="header-actions">
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
    </header>

    <!-- КАТЕГОРИИ -->
    <nav class="categories animate-slide-down" id="categoriesNav">
        <button class="category-btn active" data-filter="all">🏠 Все</button>
        <button class="category-btn" data-filter="фильм">🎥 Фильмы</button>
        <button class="category-btn" data-filter="сериал">📺 Сериалы</button>
        <button class="category-btn" data-filter="аниме">🌸 Аниме</button>
        <button class="category-btn" data-filter="продолжить">⏳ Продолжить</button>
    </nav>

    <!-- КОНТЕЙНЕР ДЛЯ КОНТЕНТА -->
    <div id="contentContainer">

        <!-- ГЛАВНАЯ СТРАНИЦА -->
        <div id="homePage" class="page active">
            
            <!-- Баннер -->
            <section class="banner animate-fade-in">
                <div class="banner-content">
                    <h2>Добро пожаловать в AnimeBox</h2>
                    <p>Смотри любимые фильмы и сериалы в отличном качестве</p>
                </div>
            </section>

            <!-- Новинки -->
            <section class="section">
                <div class="section-header">
                    <h3>🔥 Новинки</h3>
                    <span class="section-count" id="newCount">0</span>
                </div>
                <div class="results-grid" id="newReleases"></div>
            </section>

            <!-- Популярное -->
            <section class="section">
                <div class="section-header">
                    <h3>⭐ Популярное</h3>
                    <span class="section-count" id="popularCount">0</span>
                </div>
                <div class="results-grid" id="popularTitles"></div>
            </section>

            <!-- Продолжить просмотр -->
            <section class="section" id="continueSection">
                <div class="section-header">
                    <h3>⏳ Продолжить просмотр</h3>
                    <span class="section-count" id="continueCount">0</span>
                </div>
                <div class="results-grid" id="continueWatching"></div>
            </section>
        </div>

        <!-- СТРАНИЦА РЕЗУЛЬТАТОВ ПОИСКА -->
        <div id="searchPage" class="page">
            <div class="section-header">
                <h3 id="searchTitle">Результаты поиска</h3>
            </div>
            <div class="results-grid" id="searchResults"></div>
        </div>

        <!-- ДЕТАЛИ ТАЙТЛА -->
        <div id="detailsPage" class="page">
            <button id="backBtn" class="back-btn animate-hover">← Назад</button>
            <div id="detailsContent"></div>
        </div>
    </div>

    <!-- ПЛЕЕР -->
    <div id="playerOverlay" class="player-overlay">
        <div class="player-wrapper animate-scale-up">
            <div class="player-header">
                <span id="playerTitle" class="player-title">Сейчас смотрите</span>
                <button id="closePlayer" class="close-player-btn">✕</button>
            </div>
            <video id="videoPlayer" controls>
                <source id="videoSource" src="">
            </video>
            <div class="player-controls-info">
                <span>⏱️ Прогресс сохраняется автоматически</span>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
