<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя кинотека</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h1>🔒 Введите пароль</h1>
            <input type="password" id="password-input" placeholder="Пароль">
            <button id="login-btn">Войти</button>
            <p id="error-message" class="hidden">Неверный пароль</p>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="header">
            <h1>🎬 Моя коллекция</h1>
            <button id="logout-btn">Выйти</button>
        </div>

        <!-- Сетка с фильмами -->
        <div class="gallery" id="gallery">
            <!-- Карточка фильма -->
            <div class="movie-card" data-src="https://example.com/video1.mp4">
                <img src="https://via.placeholder.com/300x450/1a1a2e/white?text=Аниме+1" alt="Постер">
                <div class="movie-title">Название фильма</div>
                <button class="play-btn">▶ Смотреть</button>
            </div>
        </div>

        <!-- ПЛЕЕР -->
        <div id="player-overlay" class="hidden">
            <div class="player-container">
                <button id="close-player">✕</button>
                <video id="video-player" controls>
                    <source id="video-source" src="" type="video/mp4">
                </video>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
