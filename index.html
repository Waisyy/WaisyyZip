<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
    <div class="login-box">
        <h1>🎬 AnimeBox</h1>
        <p>Введите пароль</p>
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <div id="errorMsg" style="color: #ff4757; margin-top: 12px; display: none;">Неверный пароль</div>
    </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div id="mainContent" style="display: none; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a2e; padding: 16px 24px; border-radius: 12px;">
        <h1 style="color: #6c63ff;">🎬 AnimeBox</h1>
        <button id="logoutBtn" style="background: #ff4757; border: none; padding: 8px 20px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;">Выйти</button>
    </div>
    
    <h2 style="color: white; margin-top: 30px;">🔥 Моя коллекция</h2>
    
    <div id="gallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
        
        <!-- КАРТОЧКА 1 -->
        <div class="movie-card" data-src="https://1024terabox.com/s/191Dg29EaIPBUu8vqzf-E-w">
            <img src="https://1024terabox.com/s/1xWT6oP7Z6Ib-hXghyAad_w" style="width: 100%; border-radius: 12px;">
            <h4 style="color: white; margin: 10px 0 6px;">Тестовое видео</h4>
            <button class="playBtn" style="width: 100%; padding: 10px; background: #6c63ff; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;">▶ Смотреть</button>
        </div>
        
    </div>
</div>

<!-- ПЛЕЕР -->
<div id="playerOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center;">
    <div style="width: 85%; max-width: 900px; position: relative;">
        <button id="closePlayer" style="position: absolute; top: -45px; right: 0; background: none; border: none; color: white; font-size: 28px; cursor: pointer;">✕</button>
        <video id="videoPlayer" controls style="width: 100%; border-radius: 12px; background: black;">
            <source id="videoSource" src="">
        </video>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
