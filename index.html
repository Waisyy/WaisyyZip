<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeBox — твоя коллекция</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
    <div class="login-box">
        <h1>🎬 AnimeBox</h1>
        <p>Введите пароль для доступа</p>
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <div id="errorMsg" style="color: #ff4757; margin-top: 12px; display: none;">❌ Неверный пароль</div>
    </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div id="mainContent" style="display: none;">

    <!-- ШАПКА -->
    <header class="header">
        <div class="logo">🎬 AnimeBox</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Поиск фильмов, сериалов, аниме..." autocomplete="off">
            <button id="searchBtn">🔍</button>
        </div>
        <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
    </header>

    <!-- РЕЗУЛЬТАТЫ ПОИСКА -->
    <div id="resultsContainer" class="results-container">
        <!-- Сюда будут подгружаться результаты через JavaScript -->
    </div>

    <!-- ДЕТАЛИ ТАЙТЛА (список серий) -->
    <div id="detailsContainer" class="details-container" style="display: none;">
        <button id="backBtn" class="back-btn">← Назад к результатам</button>
        <div id="detailsContent"></div>
    </div>

    <!-- ПЛЕЕР -->
    <div id="playerOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center;">
        <div style="width: 85%; max-width: 900px; position: relative;">
            <button id="closePlayer" style="position: absolute; top: -45px; right: 0; background: none; border: none; color: white; font-size: 28px; cursor: pointer;">✕</button>
            <video id="videoPlayer" controls style="width: 100%; border-radius: 12px; background: black;">
                <source id="videoSource" src="">
            </video>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
